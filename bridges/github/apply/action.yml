name: Gardener GitHub apply bridge
description: Applies one validated Gardener effect without checking out or executing repository code.
author: Gardener
inputs:
  artifact-path:
    description: Path to the downloaded Gardener effect plan.
    required: true
  expected-sha256:
    description: SHA-256 digest emitted by the planning job.
    required: true
  github-token:
    description: Effects-job GitHub token.
    required: true
  runtime-url:
    description: HTTPS origin of the customer-deployed Gardener runtime.
    required: true
  deadline-at:
    description: Immutable UTC deadline for the effects job.
    required: true
  capture-artifact-path:
    description: Downloaded trusted capture directory for capture-backed plans.
    required: false
outputs:
  status:
    description: Applied or stopped plan status.
  completed-operations:
    description: Number of operation receipts recorded.
  operation-id:
    description: Stable identifier of the last attempted operation.
  resource-url:
    description: GitHub URL produced by the last attempted operation, when any.
  comment-id:
    description: GitHub comment identifier, retained for qualification compatibility.
  comment-url:
    description: URL of the created or reconciled comment, retained for qualification compatibility.
runs:
  using: node24
  main: dist/index.cjs
branding:
  icon: message-square
  color: green
