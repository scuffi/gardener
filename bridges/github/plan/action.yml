name: Gardener GitHub plan bridge
description: Connects an unprivileged GitHub runner to a customer-deployed Gardener runtime.
author: Gardener
inputs:
  runtime-url:
    description: HTTPS origin of the customer-deployed Gardener runtime.
    required: true
  task-bundle-hash:
    description: Lowercase SHA-256 digest of the compiled TaskBundleV1.
    required: true
  max-reconnects:
    description: Maximum Cap'n Web reconnection attempts after the initial connection.
    required: false
    default: "5"
  github-token:
    description: >-
      Optional repository-scoped token enabling the read-only provider API tool.
      It is captured by the bridge process, removed from the environment before
      any task command runs, and never exposed to repository shell execution.
    required: false
    default: ""
outputs:
  status:
    description: Terminal planning status.
  summary:
    description: Bounded terminal planning summary.
  last-server-sequence:
    description: Last server action sequence observed by the runner.
  last-completed-sequence:
    description: Last action sequence durably completed by the runner.
  effect-artifact-path:
    description: Absolute path to the validated effect artifact produced by planning.
  effect-artifact-sha256:
    description: SHA-256 digest of the validated effect artifact.
  effect-operation-count:
    description: Number of ordered operations in the exact effect artifact.
  capture-artifact-path:
    description: >-
      Absolute runner-local path of the verified working-tree capture this plan
      commits. Present only when planning completed and the plan binds a
      capture. The reusable workflow uploads this directory as the trusted changes artifact.
  capture-id:
    description: Identity of the verified working-tree capture bound to the plan.
  capture-changes-sha256:
    description: Digest of the captured change set, as bound into the effect plan.
runs:
  using: node24
  main: dist/index.cjs
branding:
  icon: activity
  color: green
