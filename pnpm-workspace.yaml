packages:
  - "apps/gardener"
  - "packages/*"

allowBuilds:
  esbuild: true
  workerd: true
  # Transitive install scripts that nothing here needs; denied explicitly so a
  # clean CI install does not fail on unreviewed builds.
  "@google/genai": false
  "@mongodb-js/zstd": false
  core-js-pure: false
  node-liblzma: false
  protobufjs: false

# Exact pins that were version-checked against npm and are required to keep the
# runtime and test tooling current despite the release-age gate.
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types"
  - "@types/node"
  - miniflare
  - wrangler
  - '@cloudflare/vite-plugin@1.54.4 || 1.54.6 || 1.54.7'
  - vitest@5.0.0 || 5.0.1 || 5.0.2
  - '@vitest/mocker@5.0.0 || 5.0.1 || 5.0.2'
  - '@vitest/spy@5.0.0 || 5.0.1 || 5.0.2'
  - jose@6.2.11
  - zod@4.6.1 || 4.6.2 || 4.6.5
  - vite@8.3.0
  - '@cloudflare/workerd-darwin-64@1.20260910.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260910.1'
  - '@cloudflare/workerd-linux-64@1.20260910.1'
  - '@cloudflare/workerd-linux-arm64@1.20260910.1'
  - '@cloudflare/workerd-windows-64@1.20260910.1'
  - workerd@1.20260910.1
  - hono@4.13.8
