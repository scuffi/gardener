packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  workerd: true

# These packages were explicitly version-checked against npm and are required
# to keep the Worker runtime/tooling current despite the global release-age gate.
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types"
  - "@types/node"
  - miniflare
  - wrangler
