<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <title>Gardener: a git graph growing into a plant</title>
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ec7a"/>
      <stop offset="1" stop-color="#2f9e5f"/>
    </linearGradient>
    <linearGradient id="leaf-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fdc9b"/>
      <stop offset="1" stop-color="#1f7a4a"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a3c"/>
      <stop offset="1" stop-color="#5e3b26"/>
    </linearGradient>
    <path id="l" d="M0 0C18-24 52-28 78 0C52 28 18 24 0 0Z"/>
  </defs>

  <!-- soil -->
  <ellipse cx="200" cy="356" rx="120" ry="22" fill="url(#soil)"/>
  <ellipse cx="200" cy="350" rx="104" ry="13" fill="#a0704f" opacity=".55"/>

  <!-- branches: a main line with two merged-in feature branches -->
  <g stroke="#2a8a55" stroke-width="10" stroke-linecap="round">
    <path d="M200 350C200 290 194 250 200 205S210 130 200 78"/>
    <path d="M198 282C168 270 140 252 126 222"/>
    <path d="M203 196C236 188 262 172 280 142"/>
  </g>

  <!-- leaves -->
  <use href="#l" fill="url(#leaf)" transform="translate(126 222) rotate(-150)"/>
  <use href="#l" fill="url(#leaf-dark)" transform="translate(126 222) rotate(-105) scale(.8)"/>
  <use href="#l" fill="url(#leaf)" transform="translate(280 142) rotate(-40)"/>
  <use href="#l" fill="url(#leaf-dark)" transform="translate(280 142) rotate(-80) scale(.8)"/>
  <use href="#l" fill="url(#leaf-dark)" transform="translate(200 250) rotate(-20) scale(.7)"/>
  <use href="#l" fill="url(#leaf)" transform="translate(200 78) rotate(-130) scale(1.05)"/>
  <use href="#l" fill="url(#leaf-dark)" transform="translate(200 78) rotate(-50) scale(1.05)"/>

  <!-- commits -->
  <g fill="#fff" stroke="#1f7a4a" stroke-width="7">
    <circle cx="200" cy="318" r="13"/>
    <circle cx="126" cy="222" r="13"/>
    <circle cx="201" cy="205" r="13"/>
    <circle cx="280" cy="142" r="13"/>
  </g>
  <!-- bud at the tip -->
  <circle cx="200" cy="78" r="15" fill="#c5e86c" stroke="#1f7a4a" stroke-width="7"/>
</svg>
