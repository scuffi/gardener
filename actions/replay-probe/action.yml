name: Gardener OIDC replay probe
description: Confirms that a Gardener session rejects reuse of the same GitHub Actions OIDC token.
author: Gardener
inputs:
  harness-url:
    description: HTTPS origin of the Gardener spike Worker.
    required: true
  agent-hash:
    description: Lowercase SHA-256 digest for the probe identity.
    required: true
  phase:
    description: OIDC phase to present; plan or effects.
    required: false
    default: plan
outputs:
  replay-rejected:
    description: Set to true when the second authentication was rejected as a replay.
runs:
  using: node24
  main: dist/index.cjs
