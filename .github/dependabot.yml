version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "wrangler"
      flue:
        patterns:
          - "@flue/*"
          - "@earendil-works/*"
          - "valibot"
      test-tooling:
        patterns:
          - "typescript"
          - "vitest"
          - "@types/*"
