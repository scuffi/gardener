name: Gardener OIDC replay reusable spike

on:
  workflow_call:
    inputs:
      harness-url:
        required: true
        type: string
      agent-hash:
        required: true
        type: string

permissions: {}

jobs:
  replay:
    name: Reuse one signed OIDC token
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write # Required to obtain the single token whose replay is tested.
    steps:
      - name: Authenticate twice with the same token
        uses: scuffi/gardener/actions/replay-probe@ffa37e44942e42ca9f97c3714f06d88abeb77de7 # zizmor: ignore[stale-action-refs]
        with:
          harness-url: ${{ inputs.harness-url }}
          agent-hash: ${{ inputs.agent-hash }}
