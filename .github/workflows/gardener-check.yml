name: Check Gardener tasks

# Called by a repository's generated gardener-sync.yml on pull requests that
# touch its Gardener files. It only checks that the committed generated files
# match the tasks, so it needs no token and never calls the runtime. The sync
# after merge enforces the same check; this one reports it before merge.
on:
  workflow_call:

jobs:
  check:
    name: Check tasks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the generated files
        uses: scuffi/gardener/bridges/github/sync@a096a1aec254b3d2c3b21845f5c7468fc2ed08b9
        with:
          mode: check
