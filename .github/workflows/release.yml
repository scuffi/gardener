name: Release

# Releases @scuffi/gardener with changesets.
#
# - While changesets are pending on main, the version job opens or updates the
#   "Version Packages" pull request (branch changeset-release/main), which bumps
#   the version, writes the changelog and moves the onboarding guide's pins.
# - Once that pull request is merged, main carries a version that is not on npm
#   yet, so the publish job stages it and the tag job tags the commit vX.Y.Z.
#   The tag marks the version as released, so later pushes skip it.
#
# npm trusted publishing authenticates the publish job through GitHub OIDC, so
# no npm token is stored. The trusted publisher allows only staging: a
# maintainer approves each release with 2FA (`npm stage approve` or npmjs.com)
# before anyone can install it.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Releases come only from main, including manual runs.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Starts the Check workflow on the Version Packages branch: a pull request
      # opened with GITHUB_TOKEN does not start workflows on its own. There is no
      # narrower scope: this could dispatch any workflow, Release included.
      actions: write
    outputs:
      publish: ${{ steps.unpublished.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog links each entry to the commit that added its changeset,
          # and the "already tagged" check below needs the tags. Keep both.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # Only @changesets/cli runs here, and it needs no builds, so no package code
      # runs while this job holds a write token.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Open or update the Version Packages pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: node scripts/changeset-version.mjs
          commit-message: Version Packages
          pr-title: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the Version Packages pull request
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The branch was just pushed, so allow the refs API a moment to see it.
        run: |
          for attempt in 1 2 3; do
            gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref changeset-release/main && exit 0
            sleep 10
          done
          echo "::warning::Could not start Check on changeset-release/main; start it from the Actions tab"
      # The tag marks a release as staged: a staged version stays invisible to
      # `npm view` until it is approved, so npm alone cannot tell.
      - name: Find a version that has not been released
        id: unpublished
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged"
          elif npm view "@scuffi/gardener@$version" version >/dev/null 2>&1; then
            echo "@scuffi/gardener $version is already on npm"
          else
            echo "@scuffi/gardener $version has not been released"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    if: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # npm's trusted publisher is restricted to this workflow and environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.stage.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:release-pins reads the pinned commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # `npm stage` needs npm 11.20.0 or later.
      - run: npm install -g npm@11.20.0
      - run: pnpm install --frozen-lockfile
      # The workflows the CLI generates, and the bridges they pin, must exist.
      - run: pnpm check:release-pins
      # Builds the runtime, packs the CLI, and verifies the tarball's contents.
      - run: pnpm check:cli-package
      - name: Stage the release
        id: stage
        run: |
          set -- .tmp/cli-pack/scuffi-gardener-*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one packed tarball, found: $*" >&2
            exit 1
          fi
          # Read before staging, so a failed read stops the step under `bash -e`.
          version=$(node -p "require('./packages/cli/package.json').version")
          npm stage publish "$1" --access public --provenance
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Operators deploy a release from its tag, so tag the exact commit that was
  # staged. This is its own job so that, if tagging fails, "Re-run failed jobs"
  # retries only the tag: npm refuses to stage the same version twice.
  tag:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.publish.outputs.version }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Refusing to create tag '$TAG'" >&2; exit 1 ;;
          esac
          # gh api prints the 404 body on stdout, so use the exit status, not the output.
          # Release tags are lightweight; .object.sha of an annotated tag is not the commit.
          if ! existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then existing=""; fi
          if [ -z "$existing" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            echo "Tagged $GITHUB_SHA as $TAG"
          elif [ "$existing" = "$GITHUB_SHA" ]; then
            echo "$TAG already points at $GITHUB_SHA"
          else
            echo "$TAG already points at $existing, not $GITHUB_SHA" >&2
            exit 1
          fi
