name: Gardener reusable spike

on:
  workflow_call:
    inputs:
      harness-url:
        description: HTTPS origin of the Gardener Actions v1 spike Worker.
        required: true
        type: string
      agent-hash:
        description: SHA-256 digest standing in for a compiled Agent definition.
        required: true
        type: string

permissions: {}

jobs:
  plan:
    name: Unprivileged planning runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Required only for the unprivileged repository checkout.
      id-token: write # Required to authenticate this job to the Gardener harness.
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Connect to Gardener over Cap'n Web
        id: gardener
        uses: scuffi/gardener/actions/runner@5f26e3eb0299d8c55e606d4e015d50f52d5c62c5 # zizmor: ignore[stale-action-refs]
        with:
          harness-url: ${{ inputs.harness-url }}
          agent-hash: ${{ inputs.agent-hash }}
          max-reconnects: "5"
      - name: Report terminal state
        env:
          GARDENER_STATUS: ${{ steps.gardener.outputs.status }}
          GARDENER_SUMMARY: ${{ steps.gardener.outputs.summary }}
        run: |
          printf 'Gardener status: %s\nGardener summary: %s\n' "$GARDENER_STATUS" "$GARDENER_SUMMARY"
