name: Sync Gardener tasks

# Called by a repository's generated gardener-sync.yml on pushes that touch its
# Gardener files. The runtime accepts the result only from this workflow at a
# pinned commit, on the repository's default branch.
on:
  workflow_call:
    inputs:
      runtime-url:
        required: true
        type: string

jobs:
  sync:
    name: Sync tasks
    runs-on: ubuntu-24.04
    # Two requests, the OIDC token then the sync, run one after the other. Each
    # makes up to four 30-second attempts with up to three waits of at most 30
    # seconds (Retry-After), so at most about 3.5 minutes each.
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enrol the committed tasks
        uses: scuffi/gardener/bridges/github/sync@78870a1d2416c319fa262c31338c539cf646dd26
        with:
          mode: sync
          runtime-url: ${{ inputs.runtime-url }}
