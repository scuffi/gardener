name: Sync Gardener tasks

# Called by a repository's generated gardener-sync.yml on pushes that touch its
# Gardener files. The runtime accepts the result only from this workflow at a
# pinned commit, on the repository's default branch.
on:
  workflow_call:
    inputs:
      runtime-url:
        required: true
        type: string

jobs:
  sync:
    name: Sync tasks
    runs-on: ubuntu-24.04
    # Each request retries for up to about two minutes.
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enrol the committed tasks
        uses: scuffi/gardener/bridges/github/sync@c5b562bfe68ed23a5faa704f59d88b856b43817c
        with:
          mode: sync
          runtime-url: ${{ inputs.runtime-url }}
