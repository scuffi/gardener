name: Run Gardener task

on:
  workflow_call:
    inputs:
      runtime-url:
        required: true
        type: string
      task-id:
        required: true
        type: string
      task-name:
        required: true
        type: string
      task-source:
        required: true
        type: string
      task-bundle-hash:
        required: true
        type: string

jobs:
  plan:
    name: Plan · ${{ inputs.task-name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      discussions: read
      issues: read
      pull-requests: read
      statuses: read
      id-token: write
    outputs:
      effect-sha256: ${{ steps.gardener.outputs.effect-artifact-sha256 }}
      capture-sha256: ${{ steps.gardener.outputs.capture-changes-sha256 }}
      effect-artifact-name: gardener-effect-${{ github.run_id }}-${{ github.run_attempt }}
      capture-artifact-name: gardener-capture-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run Gardener task
        id: gardener
        uses: scuffi/gardener/bridges/github/plan@c2e7dfeab6c986656405cb3043defa30c053e7e6
        with:
          runtime-url: ${{ inputs.runtime-url }}
          task-bundle-hash: ${{ inputs.task-bundle-hash }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload exact effect plan
        if: ${{ steps.gardener.outputs.effect-artifact-sha256 != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gardener-effect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gardener.outputs.effect-artifact-path }}
          if-no-files-found: error
          retention-days: 1
      - name: Upload trusted repository capture
        if: ${{ steps.gardener.outputs.capture-changes-sha256 != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gardener-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gardener.outputs.capture-artifact-path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  apply:
    name: Apply exact task plan
    needs: plan
    if: ${{ needs.plan.outputs.effect-sha256 != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No job-level permissions block: this checkout-free trusted job inherits
    # the generated caller's fixed read union and task-exact write grants. The
    # planning job above always downgrades that grant to read-only.
    steps:
      - name: Download exact effect plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.plan.outputs.effect-artifact-name }}
          path: ${{ runner.temp }}/gardener-effect
      - name: Download trusted repository capture
        if: ${{ needs.plan.outputs.capture-sha256 != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.plan.outputs.capture-artifact-name }}
          path: ${{ runner.temp }}/gardener-capture
      - name: Derive immutable effects deadline
        id: deadline
        shell: bash
        run: echo "value=$(date -u -d '+4 minutes' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Apply exact Gardener plan
        uses: scuffi/gardener/bridges/github/apply@c2e7dfeab6c986656405cb3043defa30c053e7e6
        with:
          artifact-path: ${{ runner.temp }}/gardener-effect/${{ needs.plan.outputs.effect-sha256 }}.json
          expected-sha256: ${{ needs.plan.outputs.effect-sha256 }}
          capture-artifact-path: ${{ needs.plan.outputs.capture-sha256 != '' && format('{0}/gardener-capture', runner.temp) || '' }}
          deadline-at: ${{ steps.deadline.outputs.value }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          runtime-url: ${{ inputs.runtime-url }}
