name: Run Gardener task

on:
  workflow_call:
    inputs:
      runtime-url:
        required: true
        type: string
      task-id:
        required: true
        type: string
      task-name:
        required: true
        type: string
      task-source:
        required: true
        type: string
      task-bundle-hash:
        required: true
        type: string

permissions: {}

jobs:
  plan:
    name: Plan · ${{ inputs.task-name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      effect-sha256: ${{ steps.gardener.outputs.effect-artifact-sha256 }}
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run Gardener task
        id: gardener
        uses: scuffi/gardener/bridges/github/plan@01c5749c5eb05398e8488b743a10c36c1b517fc2
        with:
          runtime-url: ${{ inputs.runtime-url }}
          task-bundle-hash: ${{ inputs.task-bundle-hash }}
      - name: Upload exact effect plan
        if: ${{ steps.gardener.outputs.effect-artifact-sha256 != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gardener-effect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gardener.outputs.effect-artifact-path }}
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply exact task effect
    needs: plan
    if: ${{ needs.plan.outputs.effect-sha256 != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: gardener-effects
    permissions:
      issues: write
      id-token: write
    steps:
      - name: Download exact effect plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gardener-effect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gardener-effect
      - name: Apply exact Gardener effect
        uses: scuffi/gardener/bridges/github/apply@01c5749c5eb05398e8488b743a10c36c1b517fc2
        with:
          artifact-path: ${{ runner.temp }}/gardener-effect/${{ needs.plan.outputs.effect-sha256 }}.json
          expected-sha256: ${{ needs.plan.outputs.effect-sha256 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          runtime-url: ${{ inputs.runtime-url }}
