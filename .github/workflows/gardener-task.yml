name: Run Gardener task

on:
  workflow_call:
    inputs:
      runtime-url:
        required: true
        type: string
      task-id:
        required: true
        type: string
      task-name:
        required: true
        type: string
      task-source:
        required: true
        type: string
      task-bundle-hash:
        required: true
        type: string
      checkout-ref:
        description: Commit to check out instead of the event's, for tasks that commit to pull request branches.
        required: false
        type: string
        default: ""
      plan-timeout-minutes:
        description: The plan job's timeout, derived from the task's runtime-seconds.
        required: false
        type: number
        default: 10
      reactions:
        description: React to the issue or comment that started this run while it works, and with the result.
        required: false
        type: boolean
        default: false

jobs:
  # Shows that the task is working on what started the run. Like apply, this
  # job is checkout-free, runs no task code, and inherits the caller's grant;
  # it only runs the fixed API calls below. A failure never fails the run.
  acknowledge:
    name: React
    if: ${{ inputs.reactions }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      reaction: ${{ steps.react.outputs.reaction }}
    steps:
      - name: Add 👀 to what started this run
        id: react
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          NODE_ID: ${{ github.event.comment.node_id || github.event.discussion.node_id }}
        run: |
          # GraphQL variables are literal $ names, not shell expansions.
          # shellcheck disable=SC2016
          case "$EVENT_NAME" in
            issues|pull_request) path="issues/$NUMBER/reactions" ;;
            issue_comment) path="issues/comments/$COMMENT_ID/reactions" ;;
            pull_request_review_comment) path="pulls/comments/$COMMENT_ID/reactions" ;;
            discussion|discussion_comment)
              [[ "$NODE_ID" =~ ^[A-Za-z0-9_=-]{1,256}$ ]] || exit 0
              gh api graphql -f id="$NODE_ID" \
                -f query='mutation($id: ID!) { addReaction(input: {subjectId: $id, content: EYES}) { reaction { content } } }' >/dev/null
              echo "reaction=graphql:$NODE_ID" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            *) exit 0 ;;
          esac
          [[ "$path" =~ ^(issues|issues/comments|pulls/comments)/[0-9]+/reactions$ ]] || exit 0
          id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/$path" -f content=eyes --jq .id)"
          [[ "$id" =~ ^[0-9]+$ ]] && echo "reaction=rest:$path/$id" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan · ${{ inputs.task-name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.plan-timeout-minutes }}
    permissions:
      checks: read
      contents: read
      discussions: read
      issues: read
      pull-requests: read
      statuses: read
      id-token: write
    outputs:
      effect-sha256: ${{ steps.gardener.outputs.effect-artifact-sha256 }}
      capture-sha256: ${{ steps.gardener.outputs.capture-changes-sha256 }}
      effect-artifact-name: gardener-effect-${{ github.run_id }}-${{ github.run_attempt }}
      capture-artifact-name: gardener-capture-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # A run queued behind an earlier round starts after that round pushed, so
      # plan on the pull request's current head. The bridge confirms it before
      # any task command runs; anything unexpected keeps the event's commit.
      - name: Resolve current pull request head
        id: head
        if: ${{ inputs.checkout-ref != '' && github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ inputs.checkout-ref }}
          EVENT_REF: ${{ github.event.pull_request.head.ref }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          sha="$EVENT_SHA"
          if current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_NUMBER" \
            --jq 'select(.state == "open" and .head.repo.id == .base.repo.id) | "\(.head.sha) \(.head.ref)"')"; then
            current_sha="${current%% *}"
            current_ref="${current#* }"
            if [[ "$current_sha" =~ ^[0-9a-f]{40}$ && "$current_ref" == "$EVENT_REF" ]]; then sha="$current_sha"; fi
          else
            echo "::warning::Could not read pull request #$PULL_NUMBER; planning on the event's head $EVENT_SHA"
          fi
          if [[ "$sha" != "$EVENT_SHA" ]]; then echo "Pull request head moved since the trigger: planning on $sha"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ steps.head.outputs.sha || inputs.checkout-ref }}
      - name: Run Gardener task
        id: gardener
        uses: scuffi/gardener/bridges/github/plan@653f8930760fbefbdbe4554aba85951d6f4f39a1
        with:
          runtime-url: ${{ inputs.runtime-url }}
          task-bundle-hash: ${{ inputs.task-bundle-hash }}
          task-name: ${{ inputs.task-name }}
          checkout-ref: ${{ steps.head.outputs.sha || inputs.checkout-ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload exact effect plan
        if: ${{ steps.gardener.outputs.effect-artifact-sha256 != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gardener-effect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gardener.outputs.effect-artifact-path }}
          if-no-files-found: error
          retention-days: 1
      - name: Upload trusted repository capture
        if: ${{ steps.gardener.outputs.capture-changes-sha256 != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gardener-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gardener.outputs.capture-artifact-path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  apply:
    name: Apply exact task plan
    needs: plan
    if: ${{ needs.plan.outputs.effect-sha256 != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No job-level permissions block: this checkout-free trusted job inherits
    # the generated caller's fixed read union and task-exact write grants,
    # plus the reaction jobs' issues, pull-requests or discussions write. It
    # only ever runs the plan's operations. The planning job above always
    # downgrades that grant to read-only.
    steps:
      - name: Download exact effect plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.plan.outputs.effect-artifact-name }}
          path: ${{ runner.temp }}/gardener-effect
      - name: Download trusted repository capture
        if: ${{ needs.plan.outputs.capture-sha256 != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.plan.outputs.capture-artifact-name }}
          path: ${{ runner.temp }}/gardener-capture
      - name: Derive immutable effects deadline
        id: deadline
        shell: bash
        run: echo "value=$(date -u -d '+4 minutes' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Apply exact Gardener plan
        uses: scuffi/gardener/bridges/github/apply@653f8930760fbefbdbe4554aba85951d6f4f39a1
        with:
          artifact-path: ${{ runner.temp }}/gardener-effect/${{ needs.plan.outputs.effect-sha256 }}.json
          expected-sha256: ${{ needs.plan.outputs.effect-sha256 }}
          capture-artifact-path: ${{ needs.plan.outputs.capture-sha256 != '' && format('{0}/gardener-capture', runner.temp) || '' }}
          deadline-at: ${{ steps.deadline.outputs.value }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          runtime-url: ${{ inputs.runtime-url }}
          task-name: ${{ inputs.task-name }}

  # Replaces 👀 with the result: 🚀 when the plan was applied, 😕 when planning
  # or applying failed, and nothing when the task proposed nothing or the run
  # was skipped or cancelled.
  settle:
    name: React with result
    needs: [acknowledge, plan, apply]
    if: ${{ always() && needs.acknowledge.outputs.reaction != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Replace 👀 with the result
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REACTION: ${{ needs.acknowledge.outputs.reaction }}
          PLAN: ${{ needs.plan.result }}
          APPLY: ${{ needs.apply.result }}
        run: |
          result=""
          if [[ "$APPLY" == success ]]; then result=rocket
          elif [[ "$PLAN" == failure || "$APPLY" == failure ]]; then result=confused
          fi
          # GraphQL variables are literal $ names, not shell expansions.
          # shellcheck disable=SC2016
          case "$REACTION" in
            rest:*)
              reaction="${REACTION#rest:}"
              [[ "$reaction" =~ ^((issues|issues/comments|pulls/comments)/[0-9]+/reactions)/([0-9]+)$ ]] || exit 0
              path="${BASH_REMATCH[1]}"
              if [[ -n "$result" ]]; then gh api -X POST "repos/$GITHUB_REPOSITORY/$path" -f content="$result" >/dev/null; fi
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/$path/${BASH_REMATCH[3]}" ;;
            graphql:*)
              id="${REACTION#graphql:}"
              [[ "$id" =~ ^[A-Za-z0-9_=-]{1,256}$ ]] || exit 0
              if [[ -n "$result" ]]; then
                gh api graphql -f id="$id" -f content="${result^^}" \
                  -f query='mutation($id: ID!, $content: ReactionContent!) { addReaction(input: {subjectId: $id, content: $content}) { reaction { content } } }' >/dev/null
              fi
              gh api graphql -f id="$id" \
                -f query='mutation($id: ID!) { removeReaction(input: {subjectId: $id, content: EYES}) { reaction { content } } }' >/dev/null ;;
          esac
